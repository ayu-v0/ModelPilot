services:
  modelpilot:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MODELPILOT_API_KEY: ${MODELPILOT_API_KEY:?Set MODELPILOT_API_KEY in your environment or .env}
      MODELPILOT_ALLOWED_HOSTS: ${MODELPILOT_ALLOWED_HOSTS:-}
      MODELPILOT_MAX_JOBS: ${MODELPILOT_MAX_JOBS:-4}
      MODELPILOT_JOB_TIMEOUT: ${MODELPILOT_JOB_TIMEOUT:-30m}
    volumes:
      - modelpilot-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  modelpilot-data:
